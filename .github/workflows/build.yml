name: build

# T-002e 第 3 轮：Rust UniFFI 导出 → 双 ABI 交叉编译 → Kotlin 绑定生成
#              → Kotlin 编译 → APK 打包 → APK 原生库静态检查
# 本轮只验证构建与静态产物，不执行任何 Rust 代码（运行时端到端属 T-003）

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # 固定 24.04：NDK / Rust / SDK 环境按 Ubuntu 24.04 runner 的实际软件清单设计，
    # 不依赖 ubuntu-latest 的操作系统迁移状态（与 rust.yml 保持一致）
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.7.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.0'

      # 一次装齐三样东西：
      #   platforms;android-37.0  —— SDK 平台包名不是 android-37
      #   build-tools;36.0.0
      #   ndk;30.0.16248370       —— AGP 的 ndkVersion 与 cargo-ndk 用同一个 NDK
      # 装完逐个断言版本，不只打印
      - name: Install Android SDK platform 37, build-tools 36, NDK r30
        run: |
          set -euo pipefail
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "${ANDROID_HOME:?}" -maxdepth 4 -type f -name sdkmanager | head -n 1)"
          fi
          echo "sdkmanager = $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-37.0" "build-tools;36.0.0" "ndk;30.0.16248370"

          # AGP 查 platform 哈希用 android-37，包名却是 android-37.0，建符号链接兜底
          ln -sfn "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          ls "$ANDROID_HOME/platforms"
          ls "$ANDROID_HOME/build-tools"

          NDK_DIR="${ANDROID_HOME}/ndk/30.0.16248370"
          test -d "$NDK_DIR" || { echo "::error::missing $NDK_DIR"; exit 1; }
          NDK_REV="$(grep '^Pkg.Revision' "$NDK_DIR/source.properties" | sed 's/.*= *//')"
          echo "NDK_DIR = $NDK_DIR"
          echo "source.properties Pkg.Revision = $NDK_REV"
          if [ "$NDK_REV" != "30.0.16248370" ]; then
            echo "::error::NDK revision mismatch: got $NDK_REV, expected 30.0.16248370"
            exit 1
          fi

          # 三个变量指向同一个完整版本目录（cargo-ndk 4.x 会校验一致性并取第一个）
          {
            echo "ANDROID_NDK_HOME=$NDK_DIR"
            echo "ANDROID_NDK_ROOT=$NDK_DIR"
            echo "ANDROID_NDK=$NDK_DIR"
          } >> "$GITHUB_ENV"

      - name: Install Rust 1.100.0 with Android targets
        uses: dtolnay/rust-toolchain@1.100.0
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Install cargo-ndk 4.1.2
        run: cargo install cargo-ndk --version 4.1.2 --locked

      - name: Verify toolchain versions
        run: |
          set -euo pipefail
          RUSTC_VER="$(rustc -V)"
          NDK_VER="$(grep '^Pkg.Revision' "${ANDROID_NDK_HOME}/source.properties" | sed 's/.*= *//')"
          echo "rustc: $RUSTC_VER"
          echo "cargo: $(cargo -V)"
          echo "NDK  : $NDK_VER (${ANDROID_NDK_HOME})"
          case "$RUSTC_VER" in
            "rustc 1.100.0 "*) ;;
            *) echo "::error::unexpected rustc: $RUSTC_VER"; exit 1 ;;
          esac
          echo "cargo-ndk: $(cargo ndk --version)"
          cargo ndk --version | grep -q "cargo-ndk 4.1.2" \
            || { echo "::error::unexpected cargo-ndk version"; exit 1; }
          if [ "$NDK_VER" != "30.0.16248370" ]; then
            echo "::error::unexpected NDK revision: $NDK_VER"
            exit 1
          fi

      # T-101 / T-102：统一 Provider 核心与两个 MockProvider 的单元测试。
      # 宿主目标测试，不需要 NDK / Android 工具链；--locked 锁 rust/Cargo.lock。
      # 契约测试（两个 Mock 跑同一套断言）就在这一步里，失败即令 workflow 失败。
      - name: Run Rust unit tests
        working-directory: rust
        run: cargo test --workspace --locked -- --nocapture

      # 这一步同时触发 cargoNdkBuild（cargo ndk 交叉编译）与
      # generateUniffiBindings（cargo build uniffi-bindgen + 抽元数据生成绑定）
      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      # 绑定文件必须真的生成到 AGP 的变体源目录里，且内容含探针入口；
      # 只断言文件存在不够——空文件也能「存在」。
      - name: Verify UniFFI Kotlin bindings
        run: |
          set -euo pipefail
          BINDINGS="$(find app/build -type f -name netdiskhub_core.kt | head -n 1)"
          echo "bindings = $BINDINGS"
          test -n "$BINDINGS" || { echo "::error::未生成 UniFFI Kotlin 绑定"; exit 1; }
          SIZE="$(stat -c%s "$BINDINGS")"
          echo "size = $SIZE bytes"
          test "$SIZE" -gt 20000 || { echo "::error::绑定文件过小 $SIZE"; exit 1; }
          grep -q '^package com.netdiskhub.core$' "$BINDINGS" \
            || { echo "::error::绑定 package 行不对"; exit 1; }
          grep -qF 'fun `probeMagic`' "$BINDINGS" \
            || { echo "::error::绑定里没有 probeMagic"; exit 1; }
          grep -q 'com.sun.jna' "$BINDINGS" \
            || { echo "::error::绑定里没有 JNA 依赖"; exit 1; }
          # T-101：统一 Provider 接口必须真的出现在绑定里，而不只是 Rust 侧有代码
          for NEEDLE in 'fun `providerIds`' 'open class NetdiskClient' 'class Session' 'sealed class NetdiskException' 'data class RemotePath' 'fun `quota`' 'fun `mkdir`'; do
            grep -qF "$NEEDLE" "$BINDINGS" \
              || { echo "::error::绑定里缺少 $NEEDLE"; exit 1; }
          done
          # 会话不透明性：绑定里不能出现任何 token / cookie 字段名
          if grep -nEi 'val `?(token|cookie|accessToken|refreshToken|bduss|stoken)`?' "$BINDINGS"; then
            echo "::error::绑定里出现了凭据字段，违反「不向 Kotlin 暴露明文 token」"
            exit 1
          fi
          # 变体文本字段不得叫 message：kotlin.Throwable 已有 val message，
          # 同名会让生成的 sealed class 报 Conflicting declarations 而编译失败（实测过）
          if grep -nE 'val `message`' "$BINDINGS"; then
            echo "::error::绑定里出现 val message，会与 Throwable.message 冲突；Rust 侧文本字段应改名为 detail"
            exit 1
          fi
          echo "OK: 绑定含全部通用接口符号，且无凭据字段"
          echo "--- 前 8 行 ---"
          head -n 8 "$BINDINGS"

      # Kotlin 绑定必须被真正编译进 dex，而不是只存在于源码目录
      - name: Verify Kotlin bindings are compiled into the APK
        run: |
          set -euo pipefail
          APK="$(ls app/build/outputs/apk/debug/*.apk | head -n 1)"
          echo "apk = $APK"
          rm -rf /tmp/apkdex && mkdir -p /tmp/apkdex
          unzip -o -q "$APK" 'classes*.dex' -d /tmp/apkdex
          ls -la /tmp/apkdex
          # 判据用「包路径 + 函数名」，不依赖 Kotlin 文件门面类（<文件名>Kt）的具体拼写，
          # 门面名只作为提示打印，避免因命名细节误判为绑定没编译。
          if ! grep -a -l 'Lcom/netdiskhub/core/' /tmp/apkdex/*.dex; then
            echo "::error::APK 的 dex 里没有 com.netdiskhub.core 包（绑定未参与编译）"
            exit 1
          fi
          if ! grep -a -l 'probeMagic' /tmp/apkdex/*.dex; then
            echo "::error::APK 的 dex 里没有 probeMagic"
            exit 1
          fi
          echo "OK: dex 含 com.netdiskhub.core 与 probeMagic"
          grep -a -o 'Netdiskhub_coreKt' /tmp/apkdex/*.dex | head -n 2 || true

      # 逐库检查：lib/ 清单严格比对、ELFCLASS64、e_machine、PT_LOAD 16 KB 对齐、
      # GNU_RELRO 官方 16 KB 条件、ZIP 存储与页对齐、Rust 导出符号。
      # 判据与官方文档出处写在脚本 docstring 里。
      - name: Verify APK native libraries
        run: |
          set -euo pipefail
          APK="$(ls app/build/outputs/apk/debug/*.apk | head -n 1)"
          # 先跑官方 16 KB 文档 Example 1–4 的回归，确认 RELRO 判定实现与官方一致
          python3 scripts/verify-apk-native-libs.py --selftest
          python3 scripts/verify-apk-native-libs.py "$APK"

      # 官方 16 KB 页面文档要求的 zipalign 验收，与上面的 python ZIP 检查互为交叉验证：
      #   https://developer.android.com/guide/practices/page-sizes
      # 该命令必须真实执行，输出末行为 "Verification successful"，失败即令 workflow 失败。
      - name: Verify APK zipalign 16 KB page alignment
        run: |
          set -euo pipefail
          APK="$(ls app/build/outputs/apk/debug/*.apk | head -n 1)"
          ZIPALIGN="${ANDROID_HOME:?}/build-tools/36.0.0/zipalign"
          test -x "$ZIPALIGN" || { echo "::error::missing zipalign at $ZIPALIGN"; exit 1; }
          echo "zipalign = $ZIPALIGN"
          echo "apk      = $APK"
          set +e
          ZIPALIGN_OUT="$("$ZIPALIGN" -v -c -P 16 4 "$APK" 2>&1)"
          ZIPALIGN_RC=$?
          set -e
          printf '%s\n' "$ZIPALIGN_OUT"
          if [ "$ZIPALIGN_RC" -ne 0 ]; then
            echo "::error::zipalign -c -P 16 4 失败，退出码 $ZIPALIGN_RC"
            exit 1
          fi
          if ! printf '%s\n' "$ZIPALIGN_OUT" | grep -q 'Verification successful'; then
            echo "::error::zipalign 输出里没有 Verification successful"
            exit 1
          fi
          echo "OK: zipalign 报告 Verification successful"

      # ---- T-003：真实 Android 运行时验证 ----
      # 目标：在 x86_64 模拟器上真实加载 libnetdiskhub_core.so 与 libjnidispatch.so，
      # 跑通 UniFFI 调用链。宿主机 cargo test 不能代替（用户明确要求）。
      # 不用第三方 Action：全部走官方 sdkmanager / avdmanager / emulator / adb，
      # 避免引入未经批准的第三方依赖，失败时日志也都在本 workflow 里。

      - name: Enable KVM access
        run: |
          set -euo pipefail
          if [ ! -e /dev/kvm ]; then
            echo "::error::/dev/kvm 不存在，GitHub 托管 runner 应自带 KVM 加速设备"
            exit 1
          fi
          sudo chmod 666 /dev/kvm
          ls -l /dev/kvm
          grep -cE 'vmx|svm' /proc/cpuinfo || true

      # 首跑踩到的真实故障：ubuntu-24.04 runner 缺 libpulse.so.0，
      # qemu-system-x86_64 加载失败 -> emulator 进程立即退出 ->
      # adb wait-for-device 永远等不到设备 -> 整步 45 分钟超时。
      # 所以运行库必须显式装好，并且用 ldd 硬断言，不允许再静默退化。
      - name: Install emulator runtime dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpulse0 libnss3 libx11-6 libxcomposite1 libxcursor1 libxi6 libxtst6 libxdamage1 libxrandr2 libglu1-mesa libgl1 libgles2 libasound2t64 \
            || sudo apt-get install -y --no-install-recommends \
              libpulse0 libnss3 libx11-6 libxcomposite1 libxcursor1 libxi6 libxtst6 libxdamage1 libxrandr2 libglu1-mesa libgl1 libgles2 libasound2

      - name: Install emulator and x86_64 system image
        run: |
          set -euo pipefail
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME" -maxdepth 4 -type f -name sdkmanager | head -n 1)"
          fi
          echo "sdkmanager = $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          # 选 x86_64：APK 里本来就有 x86_64 版 libnetdiskhub_core.so，
          # 正好验证真实 ABI 的原生库加载；android-37.0 的 google_apis（非 ps16k）镜像最稳。
          "$SDKMANAGER" "emulator" "platform-tools" "system-images;android-37.0;google_apis;x86_64"
          ls "$ANDROID_HOME/system-images/android-37.0/google_apis"
          QEMU="$ANDROID_HOME/emulator/qemu/linux-x86_64/qemu-system-x86_64"
          echo "qemu = $QEMU"
          # 判据说明（两次踩坑后的结论）：
          #  1) ldd 整条链不能当判据——模拟器自带的 Qt/webrtc/protobuf 等库随包发布，
          #     靠 RPATH $ORIGIN 在运行时解析，ldd 直接扫会报几十个 not found（假阳性）；
          #  2) 只 grep ldd 输出也不可靠——libnss3/libGL 不是 qemu 的静态 NEEDED，
          #     而是 dlopen 的，ldd 输出里干脆不出现（假阴性）。
          # 所以改用 ldconfig 查系统库是否真的存在于加载路径，再用 emulator -version
          # 的真实加载作为最终证明。
          # libpulse.so.0 是首跑真正导致 qemu 起不来的那个库，缺了必须硬失败；
          # 其余按「存在则记录、缺失只告警」，因为它们是 dlopen 的可选依赖，
          # 是否真需要由下一步 emulator -version 的真实加载来定论。
          if ! ldconfig -p | grep -q "libpulse.so.0"; then
            echo "::error::系统缺少 libpulse.so.0，qemu-system-x86_64 无法加载"
            exit 1
          fi
          echo "OK: libpulse.so.0 存在"
          for LIB in libnss3.so libX11.so.6 libGL.so.1 libGLESv2.so.2 libEGL.so.1; do
            if ldconfig -p | grep -q "$LIB"; then
              echo "OK: $LIB 存在"
            else
              echo "::warning::系统未提供 $LIB（dlopen 可选依赖，交给 emulator -version 验证）"
            fi
          done
          # 直接管道到 head 会让 emulator 收到 SIGPIPE，配合 pipefail 会误判失败，
          # 但也不能用 || true 掩盖真正的加载失败。
          if ! "$ANDROID_HOME/emulator/emulator" -version > /tmp/emu-version.txt 2>&1; then
            echo "::error::emulator -version 执行失败"
            cat /tmp/emu-version.txt
            exit 1
          fi
          head -n 3 /tmp/emu-version.txt

      # 第 5 次跑（run 46140280455）的真实故障：avdmanager 把 AVD 建到
      # /home/runner/.config/.android/avd，而 emulator 只查 $HOME/.android/avd，
      # 于是报 Unknown AVD name [netdiskhub-t003]，又白等了 10 分钟。
      # 处理：建完后从文件系统里找出 netdiskhub-t003.ini，把它的目录写进
      # $GITHUB_ENV 的 ANDROID_AVD_HOME，让后面的 emulator 用同一个根目录。
      - name: Create AVD
        run: |
          set -euo pipefail
          AVDMANAGER="$(command -v avdmanager || true)"
          if [ -z "$AVDMANAGER" ]; then
            AVDMANAGER="$(find "$ANDROID_HOME" -maxdepth 4 -type f -name avdmanager | head -n 1)"
          fi
          echo "avdmanager = $AVDMANAGER"
          if ! printf 'no\n' | "$AVDMANAGER" create avd -n netdiskhub-t003 \
              -k "system-images;android-37.0;google_apis;x86_64" --force > /tmp/avd-create.log 2>&1; then
            echo "::error::avdmanager create avd 失败"
            cat /tmp/avd-create.log
            exit 1
          fi
          cat /tmp/avd-create.log
          AVD_INI="$(find "$HOME" -maxdepth 6 -type f -name netdiskhub-t003.ini 2>/dev/null | head -n 1)"
          if [ -z "$AVD_INI" ]; then
            echo "::error::找不到 netdiskhub-t003.ini，AVD 没有真正创建"
            find "$HOME" -maxdepth 6 -name '*.avd' -o -maxdepth 6 -name '*.ini' 2>/dev/null | head -20 || true
            exit 1
          fi
          AVD_HOME_DIR="$(dirname "$AVD_INI")"
          echo "ANDROID_AVD_HOME=$AVD_HOME_DIR" >> "$GITHUB_ENV"
          echo "AVD ini = $AVD_INI"
          echo "ANDROID_AVD_HOME = $AVD_HOME_DIR"
          "$AVDMANAGER" list avd

      # 前 6 次跑的真实结论：依赖、AVD 路径、KVM 都已就绪，emulator 进程能起来并打印
      # "Emulator is performing a full startup"，但宿主侧 adb devices 始终为空列表。
      # 第 7 次跑（run 46142913865）又试了 auto 与 guest 两种 GPU 模式，各等 5 分钟，
      # 两次都拿不到设备；而失败时的 emulator 日志没有被上传（cp 只在启动成功后执行），
      # 所以无法定论到底是 boot 卡住、adb 端口没起、还是端口被别的进程占用。
      # 本次改为：单次启动 + 更高的内核/内存配额 + 固定 adb 端口 5555 + verbose 全量日志，
      # 轮询期间每 60 秒打印 adb devices 与 555x 端口监听状态；失败时打印日志关键词，
      # 并由后面的 always 步骤把日志上传成 artifact，避免再盲试。
      - name: Run Android instrumented tests on emulator
        timeout-minutes: 40
        run: |
          set -euo pipefail
          EMULATOR="$ANDROID_HOME/emulator/emulator"
          ADB="$ANDROID_HOME/platform-tools/adb"
          mkdir -p /tmp/emu
          "$EMULATOR" -accel-check || true
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME"
          "$EMULATOR" -list-avds
          if ! "$EMULATOR" -list-avds | grep -qx netdiskhub-t003; then
            echo "::error::emulator -list-avds 里没有 netdiskhub-t003"
            exit 1
          fi
          "$ADB" kill-server || true
          "$ADB" start-server
          "$ADB" devices -l || true
          echo "---- AVD config.ini ----"
          sed -n "1,80p" "$ANDROID_AVD_HOME/netdiskhub-t003.avd/config.ini" || true
          echo "---- 启动模拟器：verbose + 固定端口 5555 ----"
          "$EMULATOR" -avd netdiskhub-t003 \
            -no-window -no-audio -no-boot-anim -no-snapshot \
            -ports 5554,5555 -memory 4096 -cores 4 \
            -accel on -camera-back none -camera-front none \
            -no-metrics -netdelay none -netspeed full -verbose \
            > /tmp/emu/emulator.log 2>&1 &
          EMU_PID=$!
          echo "emulator pid = $EMU_PID"
          BOOTED=0
          for i in $(seq 1 140); do
            if [ "$("$ADB" shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" = "1" ]; then
              BOOTED=1
              echo "boot completed，第 $i 次轮询（约 $((i * 5)) 秒）"
              break
            fi
            if ! kill -0 "$EMU_PID" 2>/dev/null; then
              echo "模拟器进程提前退出（第 $i 次轮询）"
              break
            fi
            if [ $((i % 12)) -eq 0 ]; then
              echo "---- 第 $i 次轮询（约 $((i * 5)) 秒）----"
              "$ADB" devices -l || true
              ss -lntp 2>/dev/null | grep -E ":555[0-9]" || echo "（宿主机未监听 555x 端口）"
              tail -n 5 /tmp/emu/emulator.log || true
            fi
            sleep 5
          done
          if [ "$BOOTED" -ne 1 ]; then
            echo "::error::等待 sys.boot_completed 超时"
            "$ADB" devices -l || true
            ss -lntp 2>/dev/null | grep -E ":555[0-9]" || true
            echo "---- emulator.log 末尾 200 行 ----"
            tail -n 200 /tmp/emu/emulator.log || true
            echo "---- emulator.log 关键词 ----"
            grep -nEi "error|panic|cannot|hang|timeout|failed" /tmp/emu/emulator.log | tail -n 60 || true
            kill "$EMU_PID" 2>/dev/null || true
            exit 1
          fi
          echo "sdk = $("$ADB" shell getprop ro.build.version.sdk | tr -d "\r")"
          echo "abi = $("$ADB" shell getprop ro.product.cpu.abi | tr -d "\r")"
          "$ADB" shell input keyevent 82 || true
          "$ADB" shell settings put global window_animation_scale 0 || true
          "$ADB" shell settings put global transition_animation_scale 0 || true
          "$ADB" shell settings put global animator_duration_scale 0 || true
          "$ADB" logcat -c || true
          set +e
          # pipefail 已开：管道的退出码就是 gradle 的退出码，必须紧接着取值
          gradle :app:connectedDebugAndroidTest --no-daemon --stacktrace 2>&1 | tee /tmp/emu/gradle-test.log
          TEST_RC=$?
          set -e
          "$ADB" logcat -d -v threadtime > /tmp/emu/logcat.txt || true
          "$ADB" shell pm list packages | grep netdiskhub || true
          echo "connectedDebugAndroidTest exit code = $TEST_RC"
          exit "$TEST_RC"

      # 无论模拟器那一步成功还是失败，都把 /tmp/emu 下的日志收集起来上传，
      # 否则失败时又只能靠猜（第 1–7 次跑的共同教训）。
      - name: Collect emulator diagnostics
        if: always()
        run: |
          set -euo pipefail
          mkdir -p app/build/emulator-artifacts
          cp -f /tmp/emu/*.log /tmp/emu/*.txt app/build/emulator-artifacts/ 2>/dev/null || true
          ls -l app/build/emulator-artifacts || true
      # 只「跑完不报错」不够：必须证明用例数、零失败、零跳过，
      # 且 T-003 十项与 T-103 十二项的用例名都出现在结果里。
      - name: Verify instrumented test results
        run: python3 scripts/verify-android-test-results.py

      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-instrumented-test-reports
          path: |
            app/build/reports/androidTests/**
            app/build/outputs/androidTest-results/**
            app/build/emulator-artifacts/**
          if-no-files-found: warn

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error